version: 2
seeds:
  - name: dim_sku
    description: Basic dimension table for product SKUs
    columns:
      - name: sku_sk
        description: Unique SKU identifier
        tests:
          - unique
          - not_null
      - name: merchant_name
        description: Name of the shop
        tests:
          - not_null
      - name: sku_natural_name
        description: Name of the product
        tests:
          - not_null
    tests:
       - dbt_utils.unique_combination_of_columns:
           arguments:
             combination_of_columns:
               - merchant_name
               - sku_natural_name
  - name: raw_description_updates_seed
    description: Transaction record table for AI-generated product description
    columns:
      - name: sku_sk
        description: Unique SKU identifier
        tests:
          - unique
          - not_null
      - name: description_text
        description: Production description text generated by AI
        tests:
          - not_null
      - name: generated_at
        description: Timestamp when the description was generated
        tests:
          - not_null



